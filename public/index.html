<style>
    /* Active submenu button styles */
    .active-button { 
        background-color: #007BFF; 
        color: white;
        border: 2px solid #0056b3;
    }
</style>

<script>
    // Check localStorage for the active business mode
    const activeBusinessMode = localStorage.getItem('activeBusinessMode');
    if (activeBusinessMode) {
        // Apply the active class to the selected business mode button
        document.querySelector(`.business-mode[data-mode='${activeBusinessMode}']`).classList.add('active-button');
    }

    // Business menu logic to handle button clicks
    const businessButtons = document.querySelectorAll('.business-mode');
    businessButtons.forEach(button => {
        button.addEventListener('click', function() {
            const mode = this.getAttribute('data-mode');
            // Store the active mode in localStorage
            localStorage.setItem('activeBusinessMode', mode);
            // Remove active class from all buttons
            businessButtons.forEach(btn => btn.classList.remove('active-button'));
            // Add active class to the clicked button
            this.classList.add('active-button');
        });
    });
</script>
