let wakeLock = null;

async function keepScreenAwake() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
      console.log("🔋 Wake Lock activado");
    }
  } catch (err) {
    console.warn("Wake Lock error:", err);
  }
}

function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release();
    wakeLock = null;
    console.log("🔋 Wake Lock liberado");
  }
}

const isIphone = /iPhone|iPad|iPod/i.test(navigator.userAgent);

function getTodayDate() {
  return new Date().toISOString().split("T")[0];
}
function getHistoryKey() {
  return "chatHistory_" + getTodayDate();
}
function saveHistory(userMsg, botMsg) {
  const key = getHistoryKey();
  let h = JSON.parse(localStorage.getItem(key) || "[]");
  h.push({ user: userMsg, bot: botMsg });
  if (h.length > 5) h = h.slice(-5);
  localStorage.setItem(key, JSON.stringify(h));
}
function loadLastMessage() {
  const h = JSON.parse(localStorage.getItem(getHistoryKey()) || "[]");
  if (h.length > 0) {
    userText.textContent = h[h.length - 1].user;
    botText.textContent = h[h.length - 1].bot;
  }
}

<script>
/* ----------------------------------------------------------

----------------------------------------------------------- */
let currentSpeed = Number(localStorage.getItem("voiceSpeed") || 1.0);
document.addEventListener("DOMContentLoaded", () => {
  // Si no existe velocidad guardada → fijar normal (1.0)
  if (!localStorage.getItem("voiceSpeed")) {
    localStorage.setItem("voiceSpeed", "1.0");
    currentSpeed = 1.0;
  }

  const savedSpeed = String(localStorage.getItem("voiceSpeed"));

  // Marcar visualmente la velocidad activa
  speedMenu.querySelectorAll("div").forEach(item => {
    if (item.getAttribute("data-speed") === savedSpeed) {
      item.classList.add("active");
    } else {
      item.classList.remove("active");
    }
  });
});


const speedBtn = document.getElementById("speedBtn");
const speedMenu = document.getElementById("speedMenu");

if (speedBtn && speedMenu) {
  speedBtn.addEventListener("click", () => {
    speedMenu.style.display = speedMenu.style.display === "flex" ? "none" : "flex";
  });

 speedMenu.querySelectorAll("div").forEach(item => {
  item.addEventListener("click", () => {

    // Quitar highlight de todos
    speedMenu.querySelectorAll("div").forEach(d => d.classList.remove("active"));

    // Activar el seleccionado

    // Guardar velocidad

    localStorage.setItem("voiceSpeed", selected);

    // Cerrar menú

});


  document.addEventListener("click", (e) => {

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

/* ----------------------------------------------------------
   BOTÓN HABLAR
-------------------------------------------------- */
startBtn.onclick = async () => {

  if (!mediaStream) {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }

  // Cerrar AudioContext anterior si existe
  if (audioContext && audioContext.state !== "closed") {
    await audioContext.close();
  }

  audioContext = new AudioContext();
  const source = audioContext.createMediaStreamSource(mediaStream);
  const analyser = audioContext.createAnalyser();
  analyser.fftSize = 2048;
  source.connect(analyser);

  mediaRecorder = new MediaRecorder(mediaStream);
  audioChunks = [];

  mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

  mediaRecorder.onstop = async () => {

    // Cerrar el AudioContext para evitar acumulación
    if (audioContext && audioContext.state !== "closed") {
      audioContext.close();
    }

    userText.textContent = "";

    const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
    const formData = new FormData();
    formData.append("audio", audioBlob, "audio.webm");
     window.debugSend(transcript);

    const sttRes = await fetch("https://chatbot-xzhi.onrender.com/stt-deepgram", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${session.access_token}`
      },
      body: formData
    });

    const sttData = await sttRes.json();
    const transcript = sttData.text || "";
    console.log("🎤 STT RESULT:", transcript);
    userText.textContent = transcript;

    const fullHistory = JSON.parse(localStorage.getItem(getHistoryKey()) || "[]");
    const last3 = fullHistory.slice(-3);

    const chatRes = await fetch("https://chatbot-xzhi.onrender.com/chat", {
      method: "POST",
      headers: { 
        "Content-Type": "application/json",
        "Authorization": `Bearer ${session.access_token}`
      },
      body: JSON.stringify({
        message: transcript,
        history: last3,
        userId: window.profile?.id || session.user.id,
        firstname: window.profile.firstname,
        lastname: window.profile.lastname,
        email: window.profile.email,
        speed: Number(currentSpeed)
      })
    });

    const data = await chatRes.json();
    console.log("🤖 CHAT RAW RESPONSE:", data);

    const response = data.reply || "Error";
    botText.textContent = response;

    saveHistory(transcript, response);

    lastBotText = response;
    lastBotAudio = data.audio;

    const limit = data.dailyLimit || window.profile.daily_limit_seconds || 300;
    const remaining = Math.max(limit - (data.timeSpentToday || 0), 0);

    timeSpent.textContent = formatTime(remaining);
    timeRow.style.display = "block";

    playBackendTTS(response, data.audio);
  };

  // Detector de silencio mejorado
  const BASE_THRESHOLD = 0.02;
  let dynamicThreshold = BASE_THRESHOLD;

  const SILENCE_DURATION = 2500;
  const MIN_RECORDING_TIME = 1200;
  const MAX_RECORDING_TIME = 15000;

  const recordingStart = Date.now();
  let silenceStart = Date.now();

  function checkSilence() {
    const data = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(data);

    let sum = 0;
    for (let i = 0; i < data.length; i++) {
      const v = (data[i] - 128) / 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / data.length);

    // Threshold adaptativo
    if (rms > dynamicThreshold) {
      dynamicThreshold = rms * 0.7;
    }

    const elapsed = Date.now() - recordingStart;

    if (elapsed < MIN_RECORDING_TIME) {
      requestAnimationFrame(checkSilence);
      return;
    }

    if (elapsed > MAX_RECORDING_TIME) {
      mediaRecorder.stop();
      return;
    }

    if (rms < dynamicThreshold) {
      if (Date.now() - silenceStart > SILENCE_DURATION) {
        mediaRecorder.stop();
        return;
      }
    } else {
      silenceStart = Date.now();
    }

    requestAnimationFrame(checkSilence);
  }

  mediaRecorder.start();
  userText.textContent = "(Escuchando...)";
  checkSilence();
};

<script>
/* ----------------------------------------------------------
   TTS BACKEND — WebAudio
-------------------------------------------------- */
async function playBackendTTS(text, base64Audio) {
  try {
    if (!ttsContext) {
      console.warn("ttsContext no inicializado; ¿se pulsó Start Session?");
      return;
    }
  
    if (ttsContext.state === "suspended") {
      try {
        await ttsContext.resume();
      } catch (e) {
        console.log("Error reanudando ttsContext (fase decode):", e);
      }
    }

    const arrayBuffer = Uint8Array.from(atob(base64Audio), c => c.charCodeAt(0)).buffer;
    const audioBuffer = await ttsContext.decodeAudioData(arrayBuffer);
    await keepScreenAwake();

    const source = ttsContext.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(ttsContext.destination);

    avatar.src = "teachergif2.gif";

    const ttsStart = Date.now();

    source.onended = () => {
      releaseWakeLock();
      const ttsDuration = (Date.now() - ttsStart) / 1000;
      avatar.src = "avatarprofemujer2.jpg";

      fetch("https://chatbot-xzhi.onrender.com/ttsTime", {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "Authorization": `Bearer ${session.access_token}`
        },
        body: JSON.stringify({
          seconds: ttsDuration,
          userId: window.profile?.id || session.user.id
        })
      })
      .then(r => r.json())
      .then(d => {
        const limit = window.profile.daily_limit_seconds || 300;
        const remaining = Math.max(limit - d.total, 0);

        timeSpent.textContent = formatTime(remaining);
      });
    };

    if (ttsContext.state === "suspended") {
      try {
        await ttsContext.resume();
      } catch (e) {
        console.warn("No se pudo reanudar ttsContext justo antes de reproducir:", e);
      }
    }

    source.start(0);

  } catch (err) {
    console.warn("Error TTS backend:", err);
  }
}

      businessMenu.style.display = "block";
    } else {
      businessMenu.style.display = "none";
    }
  });

  document.querySelectorAll(".submenu-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const mode = btn.dataset.mode;

      const modeRes = await fetch("https://chatbot-xzhi.onrender.com/setBusinessMode", {
  method: "POST",
  headers: {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${session.access_token}`
  },
  body: JSON.stringify({ 
    userId: session.user.id,
    mode
  })
});

const modeData = await modeRes.json();

// ⭐ SI EL BACKEND DICE QUE SE HA SALIDO DEL MODO BUSINESS
if (modeData.exitedBusiness) {
  deactivateBusinessMode();
  showToast("Business English deactivated");

  // ⭐ LLAMADA DIRECTA A /chat PARA EL SALUDO ESPECIAL
  const chatRes = await fetch("https://chatbot-xzhi.onrender.com/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${session.access_token}`
    },
    body: JSON.stringify({
      message: "__business_exit_greeting__",
      history: [],
      userId: window.profile?.id || session.user.id,
      firstname: window.profile?.firstname,
      lastname: window.profile?.lastname,
      email: window.profile?.email,
      speed: Number(currentSpeed)
    })
  });

  const data = await chatRes.json();
  const response = data.reply || "Error";

  botText.textContent = response;
  saveHistory("", response);

  lastBotText = response;
  lastBotAudio = data.audio;

  if (data.audio) {
    playBackendTTS(response, data.audio);
  }

  businessMenu.style.display = "none";
  return;
}



      if (mode !== "exit") {
        activeBusinessMode = mode;
        businessBtn.classList.add("business-active");

        document.querySelectorAll(".submenu-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        localStorage.setItem("activeBusinessMode", mode);

        setTimeout(() => {
          showToast("Business English: " + mode.replace("_", " ") + " activated");
        }, 150);

        localStorage.removeItem(getHistoryKey());
        userText.textContent = "";
        botText.textContent = "";

        const chatRes = await fetch("https://chatbot-xzhi.onrender.com/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${session.access_token}`
          },
          body: JSON.stringify({
            message: "__start_interview__",
            history: [],
            userId: window.profile?.id || session.user.id,
            firstname: window.profile?.firstname,
            lastname: window.profile?.lastname,
            email: window.profile?.email,
            speed: Number(currentSpeed)
          })
        });

        const data = await chatRes.json();
        const response = data.reply || "Error";

        botText.textContent = response;
        saveHistory("", response);

        lastBotText = response;
        lastBotAudio = data.audio;

        if (typeof data.timeSpentToday === "number") {
          const limit = data.dailyLimit || window.profile.daily_limit_seconds || 300;
          const remaining = Math.max(limit - data.timeSpentToday, 0);

          timeSpent.textContent = formatTime(remaining);
          timeRow.style.display = "block";
        }

        if (data.audio) {
          playBackendTTS(response, data.audio);
        }

      } else {
        deactivateBusinessMode();
        showToast("Business English deactivated");
      }

      businessMenu.style.display = "none";
    });
  });

});

/* ----------------------------------------------------------
   TOAST
-------------------------------------------------- */
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;

  toast.classList.remove("show");
  void toast.offsetWidth;
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 2500);
}
</script>

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
