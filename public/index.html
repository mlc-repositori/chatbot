<label for="voiceSpeed">Select Voice Speed:</label>
<select id="voiceSpeed" onchange="saveVoiceSpeed(this.value)">
    <option value="1">Normal (1x)</option>
    <option value="0.75">Slow (0.75x)</option>
    <option value="1.5">Fast (1.5x)</option>
    <option value="2">Very Fast (2x)</option>
</select>

<script>
    // Function to save selected voice speed to localStorage
    function saveVoiceSpeed(speed) {
        localStorage.setItem('voiceSpeed', speed);
        // Here you would normally send the speed to your backend
        // Example: sendToBackend(speed);
    }

    // Function to initialize the select element with the stored value
    function initVoiceSpeed() {
        const voiceSpeed = localStorage.getItem('voiceSpeed') || '1';
        document.getElementById('voiceSpeed').value = voiceSpeed;
    }

    // Call the initialization function on page load
    window.onload = initVoiceSpeed;
</script>
